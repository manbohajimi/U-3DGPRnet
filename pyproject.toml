[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "u3dgpr-net-reproduction"
version = "0.1.0"
description = "Reproducible PyTorch implementation of U-3DGPR-Net"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "numpy>=1.24",
  "scipy>=1.10",
  "h5py>=3.8",
  "scikit-image>=0.21",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

