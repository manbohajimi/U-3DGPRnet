# U-3DGPR-Net paper architecture trained on the 3DInvNet dataset. 3DInvNet is
# already a regular 128^3 grid; only its storage order is mapped to the two
# orthogonal B-scan views used by U-3DGPR-Net.
seed: 42
device: cuda
output_dir: /home/bqwang/project/GPR/outputs/u3dgpr/transfer_3dinvnet

data:
  # 统一划分：与 3DInvNet / EMDAInvNet 使用完全相同的 5850 训 / 150 val 上游协议，
  # 否则本模型训练集只有 5265 例，跨模型不可比。val 即官方 test（上游协议自带）。
  train_manifest: /home/bqwang/project/GPR/data/processed/u3dgpr/train.csv
  val_manifest: /home/bqwang/project/GPR/data/processed/u3dgpr/val.csv
  test_manifest: /home/bqwang/project/GPR/data/processed/u3dgpr/test.csv
  allow_val_test_overlap: true   # 显式声明接受 val∩test=150；关闭则维持硬拦截
  simulated_manifest: null
  real_manifest: null
  shape: null                   # preserve each native 3DInvNet 128^3 volume
  # GPR source [t,x,y] -> model [C,D,T]=[y,x,t]. Here x is the inline
  # detection direction inside a B-scan and y indexes the stacked crosslines
  # (channels). Target: [z,x,y] -> [C,D,Z]=[y,x,z]. Thus vertical slices are
  # [x,t]=[D,T] at fixed y; channel-crossed slices are [y,t]=[C,T] at fixed x.
  axis_order: [2, 1, 0]
  # Match the official 3DInvNet loader: (clean_data + 9) / 18. Per-volume
  # z-score erased absolute amplitude information used by the inversion.
  input_normalization: fixed_minmax
  input_min: -9.0
  input_max: 9.0
  target_scale: 1.0
  num_workers: 4

model:
  # Keep the feature widths and asymmetric channel-crossed kernels reported in
  # Fig. 2. Capacity changes belong in a separate ablation, not strict repro.
  features: [1, 2, 4, 8, 16]
  activation: relu
  # No normalization type is reported in the paper. Plain BatchNorm2d is used
  # as the minimal practical completion because `none` kills the vertical
  # branch at the fixed-minmax 3DInvNet signal scale.
  normalization: batch
  fusion_hidden_channels: 8
  channel_kernels: [3, 3, 3, 1, 1]
  channel_up_kernels: [1, 1, 2, 2]
  normalize_final_decoder: true
  output_mode: full
  output_bias_init: 4.0
  output_weight_init: 0.1
  fusion_weight_init: 0.5
  return_intermediates: true

train:
  batch_size: 1
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0
  optimizer: adamax
  # Equation (6): global MSE. The previous balanced MSE over-weighted each
  # sparse target voxel by hundreds of times and produced the observed halo.
  loss: mse
  mask_threshold: 6.0
  select_metric: loss
  select_mode: min
  amp: true
  pretrained: null
  checkpoint_every: 10
